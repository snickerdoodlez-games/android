name: Deploy to Play Store

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # This adds the "Run workflow" button in the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git rev-list --count

      # 0. Set up Node.js and build frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend to dist/
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # 1. Set up Java 21 
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # 3. Authenticate using Workload Identity Federation
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/1079794258930/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@word-pairing-category-match.iam.gserviceaccount.com'

      # 4. Decode google-services.json from secret (required for Firebase Crashlytics native symbol upload)
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "google-services.json decoded successfully."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret not set. Firebase Crashlytics native symbol upload will be skipped."
          fi

      # 5. Compute auto-increment version code from git commit count
      - name: Compute version code
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Version code set to $VERSION_CODE"

      # 6. Make gradlew executable
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # 7. Build the Bundle (Firebase Crashlytics Gradle plugin uploads native debug symbols
      #    automatically when google-services.json is present and nativeSymbolUploadEnabled=true)
      - name: Build Release Bundle
        working-directory: android
        env:
          MYAPP_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/key
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew bundleRelease

      # 8. Upload to Google Play
      - name: Release to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.snickerdoodlez.wordpairing
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt