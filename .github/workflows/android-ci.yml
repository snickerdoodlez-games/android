name: Deploy to Play Store

# You must have this section to trigger the workflow
on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # This adds the "Run workflow" button in the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required for OIDC authentication
    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Set up Java 21 (required by compileOptions JavaVersion.VERSION_21)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. Set up Android SDK (required for compileSdk 35)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # 3. Authenticate using Workload Identity Federation
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/1079794258930/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@word-pairing-category-match.iam.gserviceaccount.com'

      # 4. Decode Keystore
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > release.keystore

      # 5. Make gradlew executable (required when repo is on Windows)
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # 6. Build the Bundle
      - name: Build Release Bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # 7. Upload to Google Play
      - name: Release to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          # This tells the action to use the auth credentials from Step 1
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.snickerdoodlez.wordpairing
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal



          