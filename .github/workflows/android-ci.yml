name: Deploy to Play Store

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # This adds the "Run workflow" button in the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 0. Set up Node.js and build frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend to dist/
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # 1. Set up Java 21 
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # 3. Authenticate using Workload Identity Federation
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/1079794258930/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@word-pairing-category-match.iam.gserviceaccount.com'

      # 4. Decode Keystore (Inside the android folder)
      - name: Decode Keystore
        working-directory: android
        run: echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > release.keystore

      # 5. Make gradlew executable
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # 6. Build the Bundle
      - name: Build Release Bundle
        working-directory: android
        env:
          MYAPP_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # 7. Upload to Google Play
      - name: Release to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.snickerdoodlez.wordpairing
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal