pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'androidx.benchmark.baseline-profile' version '1.2.4' apply false
    }
}

dependencyResolutionManagement {
    // This tells Gradle to enforce these repositories globally
    // and ignore individual build file repository declarations
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        flatDir {
            // Note: Ensure this path is relative to the settings.gradle location
            dirs 'capacitor-cordova-android-plugins/src/main/libs', 'libs'
        }
    }
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'