// In C:/Users/DD/New folder/android/build.gradle

plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
    id 'com.google.firebase.firebase-perf' version '1.4.2' apply false
    id 'com.google.firebase.crashlytics' version '3.0.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20' apply false
}

// ... rest of the file


apply from: "variables.gradle"

// Inject kotlin-android into pure Java library subprojects so they produce
// org.jetbrains.kotlin.platform.type=androidJvm variants that the :app consumer expects
subprojects {
    afterEvaluate {
        if (plugins.hasPlugin('com.android.library') && !plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            plugins.apply('org.jetbrains.kotlin.android')
            // Set minimal kotlin options for Java-only libraries
            kotlin {
                jvmToolchain(21)
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
