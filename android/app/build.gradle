plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.gitlab.arturbosch.detekt'
    id 'org.owasp.dependencycheck'
}
android {
    namespace = "com.snickerdoodlez.wordpairing"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.snickerdoodlez.wordpairing"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version code auto-increment: CI passes VERSION_CODE env var derived from
        // git rev-list --count (total commits). Falls back to semantic version for local builds.
        def ciVersionCode = System.getenv("VERSION_CODE")
        versionCode ciVersionCode != null ? Integer.parseInt(ciVersionCode) : 5005958
        versionName ciVersionCode != null ? ciVersionCode : "5005958"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    signingConfigs {
        release {
            // 1) CI: read from GitHub Actions environment variables
            def envStoreFile = System.getenv("MYAPP_RELEASE_KEYSTORE_PATH")
            def envStorePassword = System.getenv("MYAPP_RELEASE_STORE_PASSWORD")
            def envKeyAlias = System.getenv("MYAPP_RELEASE_KEY_ALIAS")
            def envKeyPassword = System.getenv("MYAPP_RELEASE_KEY_PASSWORD")
            if (envStoreFile != null && !envStoreFile.isEmpty()
                    && envStorePassword != null && !envStorePassword.isEmpty()
                    && envKeyAlias != null && !envKeyAlias.isEmpty()
                    && envKeyPassword != null && !envKeyPassword.isEmpty()) {
                storeFile = file(envStoreFile)
                storePassword = envStorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword
            } else {
                // 2) Local: read from gradle.properties (git-ignored, not committed)
                // Per Futurice best practices — passwords belong in gradle.properties
                try {
                    storeFile = file('key')
                    storePassword = KEYSTORE_PASSWORD
                    keyAlias = 'key0'
                    keyPassword = KEY_PASSWORD
                }
                catch (ex) {
                    throw new InvalidUserDataException(
                        "You should define KEYSTORE_PASSWORD and KEY_PASSWORD in gradle.properties."
                    )
                }
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            // Debug keystore is shared in the repo for consistent testing
            // (see android/app/.gitignore — release keys are excluded, debug key is NOT)
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'SYMBOL_TABLE'
            }
            firebaseCrashlytics {
                nativeSymbolUploadEnabled = true
                unstrippedNativeLibsDir = file("build/intermediates/merged_native_libs/release/out")
            }
        }
    }
    testOptions {
        execution = 'ANDROID_TEST_ORCHESTRATOR'
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
     lintOptions {
         abortOnError = false
     }
 }
 
 // OWASP Dependency Check configuration
 // Docs: https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
 dependencyCheck {
     // Fail the build on CVEs with CVSS score >= 7.0 (HIGH + CRITICAL)
     failBuildOnCVSS = 7.0f
     // NVD database auto-update: enabled for first run, cached afterward
     autoUpdate = true
     // Skip update if local DB is less than 4 hours old (avoids repeated downloads)
     // Set to 0 in CI to always fetch fresh data
     def ciSkip = System.getenv("CI") == "true"
     if (ciSkip) {
         autoUpdate = true
     }
     // Output formats: HTML for human review, JSON for CI parsing
     formats = ['HTML', 'JSON']
     // Suppression file for accepted false positives
     suppressionFile = 'C:/Users/DD/New folder/gitttt/android/app/dependency-check-suppression.xml'
     // Skip scanning test dependencies (only production deps matter)
     skipTestGroups = true
     analyzers {
         // Disable OSS Index (Sonatype Guide) — requires API key authentication
         ossIndexEnabled = false
     }
     // Timeout for NVD update in milliseconds (10 minutes)
      nvd {
          // Use NVD API key if available (increases rate limit)
          def nvdApiKey = System.getenv("NVD_API_KEY")
          if (nvdApiKey) {
              apiKey = nvdApiKey
          }
          validForHours = ciSkip ? 24 : 4
      }
 }

dependencies {
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    implementation "com.google.android.gms:play-services-games-v2:$playServicesGamesVersion"
    implementation "com.google.android.ump:user-messaging-platform:$userMessagingPlatformVersion"
    implementation project(':capacitor-community-admob')
     implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

     // Jackson — JSON parsing (per Futurice best practices)
     implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
     implementation 'com.fasterxml.jackson.core:jackson-core:2.19.2'
     implementation 'com.fasterxml.jackson.core:jackson-annotations:2.19.2'

     // OkHttp — HTTP client (per Futurice best practices: don't write your own)
     implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    annotationProcessor project(':capacitor-android')
    // Local unit test dependencies
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito.kotlin:mockito-kotlin:$mockitoKotlinVersion"
    testImplementation "io.mockk:mockk:$mockkVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"

    // Instrumented test dependencies
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'

    // AssertJ-Android — fluent assertions for Android tests (per Futurice best practices)
    androidTestImplementation 'com.squareup.assertj:assertj-android:1.2.0'
    implementation project(':capacitor-cordova-android-plugins')
     implementation "com.google.android.datatransport:transport-runtime:4.0.0"
     implementation "androidx.profileinstaller:profileinstaller:1.3.1"

     // Force patched versions of transitive dependencies
     // These constraints override older versions pulled by Firebase/Play Services
     constraints {
         implementation('com.google.guava:guava:33.4.8-android') {
             because 'CVE-2023-2976 + CVE-2025-29903 require guava >= 33.0.0'
         }
         implementation('com.google.protobuf:protobuf-java:4.31.1') {
             because 'CVE-2022-3171 requires protobuf-java >= 3.21.7'
         }
     }

    // LeakCanary — memory leak detection in debug builds only (per Futurice best practices)
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // Stetho — debug bridge for Chrome DevTools inspection (per Futurice best practices)
    debugImplementation 'com.facebook.stetho:stetho:1.6.0'
    debugImplementation 'com.facebook.stetho:stetho-okhttp3:1.6.0'

    // Compose BOM and Material3 Adaptive for window size classes
    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3.adaptive:adaptive'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.10.0'

}

apply from: 'capacitor.build.gradle'