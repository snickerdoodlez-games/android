
apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.snickerdoodlez.wordpairing"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 50033
        versionName "50033"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation project(':capacitor-android')
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.google.android.gms:play-services-tasks:18.4.0'
    implementation 'com.google.android.gms:play-services-stats:17.0.2'
    implementation 'com.google.android.gms:play-services-measurement:23.0.0'
    implementation 'com.google.android.gms:play-services-measurement-sdk:23.0.0'
    implementation 'com.google.android.gms:play-services-measurement-sdk-api:23.0.0'
    implementation 'com.google.android.gms:play-services-measurement-impl:23.0.0'
    implementation 'com.google.android.gms:play-services-measurement-base:23.0.0'
    implementation 'com.google.android.gms:play-services-measurement-api:23.0.0'
    implementation 'com.google.android.gms:play-services-basement:18.9.0'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'com.google.android.gms:play-services-appset:16.0.1'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.0'
    implementation 'com.google.android.gms:play-services-ads-api:24.9.0'
    implementation 'com.google.firebase:firebase-measurement-connector:20.0.1'
    implementation 'com.google.firebase:firebase-encoders:17.0.0'
    implementation 'com.google.firebase:firebase-encoders-proto:16.0.0'
    implementation 'com.google.firebase:firebase-analytics:23.0.0'
}