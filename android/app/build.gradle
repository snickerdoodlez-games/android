plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace "com.snickerdoodlez.wordpairing"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.snickerdoodlez.wordpairing"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version code auto-increment: CI passes VERSION_CODE env var derived from
        // git rev-list --count (total commits). Falls back to hardcoded value for local builds.
        def ciVersionCode = System.getenv("VERSION_CODE")
        versionCode ciVersionCode != null ? Integer.parseInt(ciVersionCode) : 5005956
        versionName ciVersionCode != null ? ciVersionCode : "5005958"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    // Load keystore properties from a local file (NOT committed to git).
    // CI provides credentials via environment variables instead.
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            // Primary: environment variables (GitHub Actions CI)
            def envStoreFile = System.getenv("MYAPP_RELEASE_KEYSTORE_PATH")
            def envStorePassword = System.getenv("MYAPP_RELEASE_STORE_PASSWORD")
            def envKeyAlias = System.getenv("MYAPP_RELEASE_KEY_ALIAS")
            def envKeyPassword = System.getenv("MYAPP_RELEASE_KEY_PASSWORD")
            if (envStoreFile != null && !envStoreFile.isEmpty()
                    && envStorePassword != null && !envStorePassword.isEmpty()
                    && envKeyAlias != null && !envKeyAlias.isEmpty()
                    && envKeyPassword != null && !envKeyPassword.isEmpty()) {
                storeFile = file(envStoreFile)
                storePassword = envStorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword
            } else if (keystoreProperties.containsKey('storeFile')) {
                // Fallback: local keystore.properties file (gitignored)
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            } else {
                // Final fallback: debug keystore for local dev/pipeline builds.
                // Produces a self-signed AAB suitable for local testing only.
                // Production Play Store signing requires CI env vars or keystore.properties.
                def debugKeystore = file(System.getProperty('user.home') + '/.android/debug.keystore')
                if (debugKeystore.exists()) {
                    storeFile = debugKeystore
                    storePassword = 'android'
                    keyAlias = 'androiddebugkey'
                    keyPassword = 'android'
                }
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir = file("build/intermediates/merged_native_libs/release/out")
            }
        }
    }
    testOptions {
        execution 'ANDROID_TEST_ORCHESTRATOR'
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    implementation "com.google.android.gms:play-services-games-v2:$playServicesGamesVersion"
    implementation "com.google.android.ump:user-messaging-platform:$userMessagingPlatformVersion"
    implementation project(':capacitor-community-admob')
    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    annotationProcessor project(':capacitor-android')
    // Local unit test dependencies
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito.kotlin:mockito-kotlin:$mockitoKotlinVersion"
    testImplementation "io.mockk:mockk:$mockkVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"

    // Instrumented test dependencies
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.google.android.datatransport:transport-runtime:3.1.8"
    implementation "androidx.profileinstaller:profileinstaller:1.3.1"

    // Compose BOM and Material3 Adaptive for window size classes
    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3.adaptive:adaptive'
    implementation 'androidx.compose.material3.adaptive:adaptive-layout'
    implementation 'androidx.compose.material3.adaptive:adaptive-navigation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.10.0'

}

apply from: 'capacitor.build.gradle'