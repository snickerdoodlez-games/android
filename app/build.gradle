apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace = "com.snickerdoodlez.wordpairing"
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            def envStoreFile = System.getenv("KEYSTORE_PATH")
            if (envStoreFile != null && !envStoreFile.isEmpty()) {
                storeFile = file(envStoreFile)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.snickerdoodlez.wordpairing"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 500593
        versionName "500593"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        execution = 'ANDROID_TEST_ORCHESTRATOR'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    implementation "com.google.android.ump:user-messaging-platform:$userMessagingPlatformVersion"
    implementation project(':capacitor-community-admob')
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.19.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.19.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "com.google.android.datatransport:transport-runtime:4.0.0"

    constraints {
        implementation('com.google.guava:guava:33.4.8-android') {
            because 'CVE-2023-2976 + CVE-2025-29903 require guava >= 33.0.0'
        }
        implementation('com.google.protobuf:protobuf-java:4.31.1') {
            because 'CVE-2022-3171 requires protobuf-java >= 3.21.7'
        }
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
    implementation 'androidx.test:runner:1.5.2'
    implementation project(':capacitor-cordova-android-plugins')
}

// Security Audit Configuration
dependencyCheck {
    analyzers {
        ossIndexEnabled = false
    }
    // Using absolute path as previously identified
    suppressionFile = 'C:/Users/DD/New folder/gitttt/android/app/dependency-check-suppression.xml'
    
    // Set to 11.0 so the build continues even if vulnerabilities are found
    failBuildOnCVSS = 11.0f
}

apply from: 'capacitor.build.gradle'    