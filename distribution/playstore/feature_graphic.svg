<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a1e"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF00E5"/>
      <stop offset="100%" style="stop-color:#FE53A3"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#04DEFB"/>
    </linearGradient>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FCBE00"/>
      <stop offset="100%" style="stop-color:#F9FF00"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39FF14"/>
      <stop offset="100%" style="stop-color:#BED739"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Neon grid lines background -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="50" x2="1024" y2="50" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="100" x2="1024" y2="100" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1024" y2="150" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1024" y2="200" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="250" x2="1024" y2="250" stroke="#FF00E5" stroke-width="1"/>
    <line x1="0" y1="300" x2="1024" y2="300" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="1024" y2="350" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="400" x2="1024" y2="400" stroke="#00E5FF" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1024" y2="450" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="500" x2="1024" y2="500" stroke="#00E5FF" stroke-width="1"/>
  </g>

  <!-- Neon accent shapes -->
  <rect x="20" y="20" width="984" height="460" rx="12" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <rect x="24" y="24" width="976" height="452" rx="10" fill="none" stroke="url(#neonPink)" stroke-width="1" opacity="0.15"/>

  <!-- Logo area (left side - simplified game tiles visual) -->
  <g transform="translate(50, 100)">
    <!-- Tile grid representation -->
    <rect x="0" y="0" width="100" height="60" rx="6" fill="none" stroke="#FF00E5" stroke-width="2" filter="url(#glow)"/>
    <text x="50" y="36" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#FF00E5" filter="url(#glow)">WORD</text>

    <rect x="110" y="0" width="100" height="60" rx="6" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>
    <text x="160" y="36" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#00E5FF" filter="url(#glow)">PAIR</text>

    <rect x="220" y="0" width="100" height="60" rx="6" fill="none" stroke="#39FF14" stroke-width="2" filter="url(#glow)"/>
    <text x="270" y="36" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#39FF14" filter="url(#glow)">MATCH</text>

    <rect x="330" y="0" width="100" height="60" rx="6" fill="none" stroke="#FCBE00" stroke-width="2" filter="url(#glow)"/>
    <text x="380" y="36" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#FCBE00" filter="url(#glow)">PLAY</text>

    <!-- Row 2 -->
    <rect x="0" y="75" width="100" height="60" rx="6" fill="rgba(0,229,255,0.1)" stroke="#00E5FF" stroke-width="1" opacity="0.6"/>
    <text x="50" y="111" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#00E5FF" opacity="0.6">TILE</text>

    <rect x="110" y="75" width="100" height="60" rx="6" fill="#00E5FF" stroke="#00E5FF" stroke-width="2" opacity="0.9"/>
    <text x="160" y="111" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#000000">SOLVED</text>

    <rect x="220" y="75" width="100" height="60" rx="6" fill="none" stroke="#FE53A3" stroke-width="2" opacity="0.6"/>
    <text x="270" y="111" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#FE53A3" opacity="0.6">GROUP</text>

    <rect x="330" y="75" width="100" height="60" rx="6" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.6"/>
    <text x="380" y="111" text-anchor="middle" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#39FF14" opacity="0.6">CAT</text>
  </g>

  <!-- Title text -->
  <text x="512" y="240" text-anchor="middle" font-family="Oswald, sans-serif" font-size="62" font-weight="700" fill="#F9FF00" filter="url(#glowStrong)" letter-spacing="4">WORD PAIRING</text>

  <!-- Subtitle -->
  <g filter="url(#glow)">
    <text x="512" y="295" text-anchor="middle" font-family="Oswald, sans-serif" font-size="28" font-weight="400" fill="#00E5FF" letter-spacing="8">CATEGORY MATCH</text>
  </g>

  <!-- Tagline -->
  <text x="512" y="340" text-anchor="middle" font-family="Oswald, sans-serif" font-size="16" font-weight="300" fill="#6B7280" letter-spacing="3">GROUP · SOLVE · CONQUER</text>

  <!-- Bottom decorative line -->
  <line x1="300" y1="370" x2="724" y2="370" stroke="url(#neonGreen)" stroke-width="1" opacity="0.4"/>
  <circle cx="290" cy="370" r="3" fill="#39FF14" opacity="0.6" filter="url(#glow)"/>
  <circle cx="734" cy="370" r="3" fill="#39FF14" opacity="0.6" filter="url(#glow)"/>

  <!-- Bottom bar with features -->
  <g transform="translate(0, 420)">
    <rect x="0" y="0" width="1024" height="80" fill="rgba(0,0,0,0.6)"/>

    <text x="170" y="45" font-family="Oswald, sans-serif" font-size="14" fill="#00E5FF" text-anchor="middle" opacity="0.8">🎮 6 GAME MODES</text>
    <line x1="260" y1="20" x2="260" y2="60" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>

    <text x="430" y="45" font-family="Oswald, sans-serif" font-size="14" fill="#FF00E5" text-anchor="middle" opacity="0.8">🧩 72 LEVELS</text>
    <line x1="520" y1="20" x2="520" y2="60" stroke="#FF00E5" stroke-width="0.5" opacity="0.3"/>

    <text x="680" y="45" font-family="Oswald, sans-serif" font-size="14" fill="#39FF14" text-anchor="middle" opacity="0.8">🏆 STAR RANKS</text>
    <line x1="770" y1="20" x2="770" y2="60" stroke="#39FF14" stroke-width="0.5" opacity="0.3"/>

    <text x="920" y="45" font-family="Oswald, sans-serif" font-size="14" fill="#FCBE00" text-anchor="middle" opacity="0.8">🌙 DARK MODE</text>
  </g>
</svg>